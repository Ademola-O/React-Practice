<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <!-- Container for React app -->
    <div class="js-container"></div>

        
    </script>

    <!-- Load React and ReactDOM from the CDN -->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!-- Load Babel for JSX transformation -->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        const button = <button>Hello</button>;
        const paragraph = <p>This is a paragraph {2 + 2} </p>;

        // React cant take more than one element so evereything is wrapped in a <div> 
        const div = (
            <div>
            <button>Hello</button>
            <p>This is a paragraph {2+2}</p>
            </div>
        );
        // Sets up the React app and renders the initial content
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(div);
    </script>
  </body>
</html>
